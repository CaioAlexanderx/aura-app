<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#060816" />
<title>Sem conexão · Aura</title>
<!-- ============================================================
     AURA. — página "sem conexão" do app instalado (PWA Fase 2, 22/09/2026)

     Servida pelo service worker (public/sw.js) SÓ quando uma navegação
     falha por falta de rede. É a única página que o service worker
     guarda em cache, junto com o ícone: o painel em si continua sem
     cache (decisão de 10/09 — bundle velho depois do deploy é pior que
     tela em branco).

     Tudo aqui é inline de propósito: sem fonte externa, sem script
     externo, sem CSS externo. Offline é offline.

     Tenta reconectar sozinha a cada 5 segundos com um HEAD em "/"
     (cache: no-store) e, quando a rede volta, recarrega o painel.
     ============================================================ -->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(ellipse at 50% 0%, rgba(109,40,217,0.22) 0%, transparent 55%), #060816;
    color: #f0edff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "DM Sans", sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 28px; text-align: center;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 340px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .logo { width: 72px; height: 72px; border-radius: 50%; box-shadow: 0 12px 34px rgba(124,58,237,0.42); }
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: 30px; line-height: 1.1; letter-spacing: -0.01em; margin: 10px 0 0; }
  h1 span { color: #7c3aed; }
  p { margin: 0; color: rgba(220,215,255,0.78); font-size: 14.5px; line-height: 1.55; }
  button {
    margin-top: 8px; background: #7c3aed; color: #fff; border: 0; border-radius: 12px;
    padding: 12px 22px; font-size: 14.5px; font-weight: 700; font-family: inherit; cursor: pointer;
  }
  button:hover { background: #8b5cf6; }
  button:focus-visible { outline: 2px solid #a78bfa; outline-offset: 2px; }
  .dica { color: rgba(170,160,235,0.70); font-size: 12px; line-height: 1.5; }
  .aviso { color: #fbbf24; font-size: 12.5px; min-height: 18px; margin-top: -4px; }
  .aviso.ok { color: #34d399; }
</style>
</head>
<body>
  <main>
    <img class="logo" src="/aura-icone-192.png" alt="" width="72" height="72" />
    <h1>Sem <span>conexão</span></h1>
    <p>A Aura precisa de internet para mostrar seus dados. Assim que a conexão voltar, é só tentar de novo.</p>
    <button id="tentar" type="button">Tentar de novo</button>
    <p class="aviso" id="aviso" aria-live="polite"></p>
    <p class="dica">Suas vendas e cadastros estão salvos no servidor. Nada se perde enquanto você está sem rede.</p>
  </main>
  <script>
    (function () {
      var aviso = document.getElementById('aviso');
      var botao = document.getElementById('tentar');
      var limpar = null;
      // A pagina tenta reconectar sozinha, em silencio (pedido do Caio,
      // 22/09: sem "verificando a conexao" piscando). So fala quando a
      // pessoa toca no botao e ainda nao ha rede, ou quando a rede volta.
      function dizer(msg, ok) {
        aviso.textContent = msg;
        aviso.className = ok ? 'aviso ok' : 'aviso';
        if (limpar) clearTimeout(limpar);
        if (!ok) limpar = setTimeout(function () { aviso.textContent = ''; }, 3000);
      }
      var destino = '/';
      try {
        // Voltar para onde a pessoa estava, não para a raiz, quando der.
        var de = new URLSearchParams(location.search).get('de');
        if (de && de.charAt(0) === '/' && de.indexOf('//') !== 0) destino = de;
      } catch (_) {}

      function voltou() {
        dizer('Conexão de volta. Abrindo a Aura…', true);
        setTimeout(function () { location.replace(destino); }, 400);
      }

      function tentar(manual) {
        fetch(destino, { method: 'HEAD', cache: 'no-store', credentials: 'same-origin' })
          .then(function (r) { if (r && (r.ok || r.type === 'opaqueredirect' || r.status === 401)) voltou(); else if (manual) dizer('Ainda sem conexão.', false); })
          .catch(function () { if (manual) dizer('Ainda sem conexão.', false); });
      }

      botao.addEventListener('click', function () { tentar(true); });
      window.addEventListener('online', function () { tentar(false); });
      setInterval(function () { if (navigator.onLine !== false) tentar(false); }, 5000);
    })();
  </script>
</body>
</html>
