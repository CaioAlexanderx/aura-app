<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teste 3D · caneca e camiseta no viewer real</title>
<!--
  Página de teste manual do viewer 3D do Aura Studio, sem subir o app.

  28/09/2026 — deixou de ser um espelho copiado à mão do compose3dMug.ts:
  agora importa o viewer REAL, transpilado por
      node scripts/studio/transpilar-viewer-de-teste.mjs
  para ./viewer/ (pasta no .gitignore). Rode o script depois de qualquer
  mudança no visualEngine e recarregue a página.

  Como abrir (o GLB, a spec e os módulos precisam vir por http, não por file://):
    na raiz do repositório:  npx serve .      (ou: python -m http.server 8000)
    depois:  http://localhost:3000/docs/studio/visual-templates/teste-3d.html
  Parâmetros opcionais:
    ?spec=./camiseta-basica-3d.json   spec (arquivo com `spec` ou a spec direta);
                                      sem ela, a caneca procedural padrão
    ?glb=../../../public/models/camiseta-basica.glb   (padrão local para a
         camiseta; sem ele usa a url da spec, que só existe depois do deploy)
    ?cor=%23111111   cor da peça      ?corArte=%23D85A30   cor da arte
    ?texto=Aura      texto de prova   ?area=front|back|panel|wrap
    ?giro=45         giro fixo em graus (desliga a rotação automática)
    ?cenario=estudio|gradiente|nenhum   o que há em volta da peça
    ?fundo=%23060816 fundo da página (o cenário deriva a paleta dele)
    ?imagem=url      foto no lugar do emblema (precisa de CORS)
  O que a página antiga tinha e esta não tem: o círculo de prova pintado na
  textura (?prova) e o retângulo tracejado da área (?retangulo) — eram do
  espelho, que desenhava a textura por conta própria. Para conferir UV,
  use a textura pintada no painel à direita (um clone do canvas do viewer
  não é acessível; o painel mostra a arte que o viewer recebe).
-->
<style>
  :root { --papel: #FBF8F3; --tinta: #1F1B16; --borda: #E7DFD3; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: var(--papel); color: var(--tinta); }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; grid-template-columns: 1fr 300px; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  canvas#cena { width: 100%; aspect-ratio: 1 / 0.78; display: block; border: 1px solid var(--borda); border-radius: 12px; cursor: grab; touch-action: none; }
  aside { display: grid; gap: 10px; align-content: start; }
  label { display: grid; gap: 4px; font-weight: 600; font-size: 12px; }
  input, select, button { font: inherit; padding: 6px 8px; border: 1px solid var(--borda); border-radius: 8px; background: #fff; }
  #status { font-size: 12px; color: #756C61; min-height: 1.4em; }
  h1 { font-size: 16px; margin: 0 0 4px; grid-column: 1 / -1; }
  small { color: #756C61; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chips button[aria-pressed="true"] { background: #7C3AED; color: #fff; border-color: #7C3AED; }
</style>
</head>
<body>
<main>
  <h1>Viewer 3D · página de teste <small>(arraste para girar; o código é o do app)</small></h1>
  <div>
    <canvas id="cena"></canvas>
    <div id="status">carregando…</div>
  </div>
  <aside>
    <label>Texto <input id="texto" value="Aura"></label>
    <label>Cor da peça <input id="cor" type="color" value="#F5F2EA"></label>
    <label>Cor da arte <input id="corArte" type="color" value="#1C1C1C"></label>
    <label>Área <div class="chips" id="areas"></div></label>
    <label>Fundo da página <input id="fundo" type="color" value="#FBF8F3"></label>
    <label>Cenário
      <select id="cenario">
        <option value="estudio">estúdio (ciclorama)</option>
        <option value="gradiente">gradiente 2D (antigo)</option>
        <option value="nenhum">nenhum (transparente)</option>
      </select>
    </label>
    <button id="recriar" type="button">Recriar o viewer (fundo e cenário só valem na criação)</button>
    <div id="info"></div>
  </aside>
</main>

<script type="module">
  const q = new URLSearchParams(location.search);
  const status = (m) => { document.getElementById("status").textContent = m; };
  let createModelViewer;
  try {
    ({ createModelViewer } = await import("./viewer/compose3dMug.js"));
  } catch (e) {
    status("Não achei ./viewer/compose3dMug.js — rode: node scripts/studio/transpilar-viewer-de-teste.mjs (e abra por http, não file://)");
    throw e;
  }

  // A spec: arquivo pedido, ou a caneca procedural padrão (a mesma leitura
  // que a vitrine faz de um template sem geometria declarada).
  const CANECA_PADRAO = {
    schema: 1,
    model: { kind: "procedural-mug", texture: { w: 2048, h: 1024 } },
    areas: [
      { id: "panel", width_cm: 9, height_cm: 9.7, uv: { u0: 0.285, v0: 0.18, u1: 0.715, v1: 0.82 } },
      { id: "wrap", width_cm: 21, height_cm: 9.7, uv: { u0: 0.02, v0: 0.18, u1: 0.98, v1: 0.82 } },
    ],
  };
  let spec = CANECA_PADRAO;
  if (q.get("spec")) {
    try {
      const template = await (await fetch(q.get("spec"))).json();
      spec = template.spec || template;
    } catch (e) {
      status("Não consegui ler a spec em " + q.get("spec") + " — abra por http (npx serve .), não por file://");
      throw e;
    }
  }
  if (spec.model && spec.model.kind === "glb") {
    const glb = q.get("glb") || (location.protocol === "file:" ? null : new URL("../../../public/models/camiseta-basica.glb", location.href).href);
    if (glb) spec.model.url = glb;
  }

  const $ = (id) => document.getElementById(id);
  if (q.get("cor")) $("cor").value = q.get("cor");
  if (q.get("corArte")) $("corArte").value = q.get("corArte");
  if (q.get("texto") !== null) $("texto").value = q.get("texto");
  if (q.get("fundo")) $("fundo").value = q.get("fundo");
  if (q.get("cenario")) $("cenario").value = q.get("cenario");
  const giroFixo = q.get("giro") !== null ? parseFloat(q.get("giro")) : null;
  const imagem = q.get("imagem");

  const areas = (spec.areas || []).map((a) => a.id);
  let areaId = q.get("area") && areas.includes(q.get("area")) ? q.get("area") : areas[0] || "panel";
  const chips = $("areas");
  const desenharChips = () => {
    chips.innerHTML = "";
    for (const id of areas) {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = id; b.setAttribute("aria-pressed", String(id === areaId));
      b.addEventListener("click", () => { areaId = id; desenharChips(); atualizar(); });
      chips.appendChild(b);
    }
  };
  desenharChips();

  const canvas = $("cena");
  let handle = null;
  const values = () => ({ text: $("texto").value, ...(imagem ? { image: imagem } : {}) });
  const opcoes = () => ({ garmentColor: $("cor").value, artColor: $("corArte").value, areaId });

  async function criar() {
    if (handle) { handle.dispose(); handle = null; }
    document.body.style.background = $("fundo").value;
    status("montando…");
    try {
      handle = await createModelViewer(canvas, spec, values(), { ...opcoes(), backdrop: $("fundo").value, cenario: $("cenario").value });
    } catch (e) {
      status("Erro ao montar o viewer: " + (e && e.message || e));
      throw e;
    }
    if (giroFixo !== null) {
      // giro determinístico por arraste sintético (0.011 rad por px), como o harness de capturas
      const px = ((giroFixo * Math.PI) / 180) / 0.011;
      const r = canvas.getBoundingClientRect();
      const ev = (t, x) => canvas.dispatchEvent(new PointerEvent(t, { clientX: r.left + 10 + x, clientY: r.top + 10, pointerId: 1, bubbles: true }));
      ev("pointerdown", 0); ev("pointermove", px); ev("pointerup", px);
    }
    $("info").innerHTML = "<small>modelo: " + (spec.model && spec.model.kind || "procedural-mug") +
      " · áreas: " + areas.join(", ") + " · cenário: " + $("cenario").value + "</small>";
    status("ok");
    window.__pronto = true;
    window.__handle = handle;
  }
  function atualizar() { if (handle) handle.update(values(), opcoes()); }

  for (const id of ["texto", "cor", "corArte"]) $(id).addEventListener("input", atualizar);
  $("recriar").addEventListener("click", criar);
  window.addEventListener("resize", () => handle && handle.resize && handle.resize());
  await criar();
</script>
</body>
</html>
